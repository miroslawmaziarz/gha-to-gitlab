name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - run: npm ci
      - name: Unit tests
        run: |
          npm test
          npm run coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - run: npm run lint
