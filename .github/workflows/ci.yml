name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.6.1673
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-
      - name: Format, lint, idioms and tests
        run: bin/check
      - name: Test coverage
        run: clojure -M:coverage | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Test coverage'
            echo '```'
            sed -n '/^|---/,$p' coverage.txt | sed 's/\x1b\[[0-9;]*m//g'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: target/coverage
